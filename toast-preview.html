<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トースト通知プレビュー</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 2rem; }
        .preview-container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 1.5rem; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-success-demo { background: var(--success-color); }
        .btn-error-demo { background: var(--danger-color); }
        .btn-warning-demo { background: var(--warning-color); }
        .btn-info-demo { background: var(--info-color); }
        .btn-all { background: var(--primary-color); }
    </style>
</head>
<body>
    <div class="preview-container">
        <h1><i class="fas fa-bell"></i> トースト通知プレビュー</h1>
        <div class="btn-group">
            <button class="btn btn-success-demo" onclick="showAlert('問題セットを保存しました！', 'success')">
                <i class="fas fa-check-circle"></i> 成功通知
            </button>
            <button class="btn btn-error-demo" onclick="showAlert('テストの完了処理に失敗しました。\n\nエラー: sanitizeHTML関数が見つかりません\n\n【原因】sanitizeHTML関数が見つかりません。\n【対処】ページを再読み込みしてください。', 'error')">
                <i class="fas fa-exclamation-circle"></i> エラー通知（複数行）
            </button>
            <button class="btn btn-warning-demo" onclick="showAlert('選択肢を選んでください', 'warning')">
                <i class="fas fa-exclamation-triangle"></i> 警告通知
            </button>
            <button class="btn btn-info-demo" onclick="showAlert('セッションの有効期限が切れました。再度ログインしてください。', 'info')">
                <i class="fas fa-info-circle"></i> 情報通知
            </button>
            <button class="btn btn-all" onclick="showAll()">
                <i class="fas fa-layer-group"></i> 全種類を同時に表示
            </button>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
        function showAll() {
            showAlert('管理者として登録されました。', 'success');
            setTimeout(() => showAlert('お名前を入力してください', 'warning'), 300);
            setTimeout(() => showAlert('セッションの有効期限が切れました。再度ログインしてください。', 'info'), 600);
            setTimeout(() => showAlert('ログインに失敗しました。もう一度お試しください。', 'error'), 900);
        }
    </script>
</body>
</html>
